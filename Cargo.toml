[package]
name = "shield"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "entity", "migration"]

[dependencies]
entity = { path = "entity" }
migration = { path = "migration" }
axum = "0.8.3"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
bcrypt = "0.17.0"
chrono = { version = "0.4.40", features = ["serde"] }
config = { version = "0.15.11", features = ["yaml"] }
dotenvy = "0.15.7"
futures = "0.3.31"
jsonwebtoken = "9.3.1"
once_cell = "1.21.3"
parking_lot = "0.12.3"
sea-orm = { version = "1.1.8", features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
sea-orm-migration = "1.1.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }
tower-http = { version = "0.6.2", features = [
    "trace",
    "compression-br",
    "propagate-header",
    "sensitive-headers",
    "cors",
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uaparser = "0.6.4"
uuid = { version = "1.16.0", features = ["v7"] }
rand = "0.9.0"
base64 = "0.22.1"
lettre = "0.11.15"
